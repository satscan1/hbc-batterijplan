# On every published release: build batterijplan.zip from custom_components/batterijplan and attach it to the
# release. HACS installs from this zip (hacs.json: zip_release), and GitHub counts its downloads.
name: Release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version matches the tag
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/batterijplan/manifest.json'))['version'])")
          t="${GITHUB_REF_NAME#v}"
          if [ "$v" != "$t" ]; then echo "manifest version $v does not match tag $GITHUB_REF_NAME"; exit 1; fi
      - name: Build batterijplan.zip
        run: |
          cd custom_components/batterijplan
          zip -r -X ../../batterijplan.zip . -x '__pycache__/*' '*.pyc'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" batterijplan.zip --clobber
