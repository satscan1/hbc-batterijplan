# Eingebautes Dashboard von Batterijplan (Deutsch). Karten: custom:batterijplan-*; von der Integration geliefert.
# Die Kartensprache folgt dem Profil (optional pro Karte: taal: nl|en|de).
title: Batterijplan
views:
- title: Batterijplan
  path: batterijplan
  icon: mdi:battery-clock
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:batterijplan-knoppen
      live: switch.batterijplan_live
      knoppen:
      - naam: Ertrag
        kaarten:
        - type: custom:batterijplan-opbrengst
          title: Was bringt es
          icon: batterijplan:euro
          perioden: true
      - naam: Heute
        breed: 820
        kaarten:
        - type: custom:batterijplan-dag-card
        - type: custom:batterijplan-spaarlijn-card
        - type: custom:batterijplan-dagen-card
      - naam: Bericht
        kaarten:
        - type: custom:batterijplan-rapport
          title: Bericht
          icon: batterijplan:info
        breed: 820
      - naam: Empfehlung HBC
        melding: advies
        kaarten:
        - type: custom:batterijplan-advies
          title: Empfehlung für HBC
          icon: batterijplan:schuifregelaars
      - naam: Einstellungen
        melding: instellingen
        kaarten:
        - type: custom:batterijplan-velden
          title: Einstellungen
          icon: batterijplan:schuifregelaars
          info: |-
            Hier stellst du Batterijplan auf deine Batterien und deinen Energievertrag ein.

            **Basis** füllst du einmal aus. **Experte** musst du meistens nicht anpassen.

            Fehlt etwas Wesentliches, bekommt die Schaltfläche Einstellungen einen orangen Punkt.

            Alle Werte werden von der Integration gespeichert und bleiben bei einem Neustart und bei einer neuen Version erhalten.
          tabs:
          - naam: Basis
            sub: Einmal einstellen und vergessen
            rows:
            - entity: number.batterijplan_capaciteit
              name: Nutzbare Batteriekapazität
              info: |-
                Was deine Batterien zusammen wirklich liefern können, oberhalb der unteren Grenze, die in HBC steht.

                Beispiel: 2 Batterien mit je 5 kWh und 10 % unterer Grenze ≈ 9,0 kWh.

                Solange dies nicht ausgefüllt ist, tut der Plan nichts.
            - entity: select.batterijplan_hbc_prijzen
              name: Preise von HBC
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Nur bei einem dynamischen Vertrag
              labels:
                kaal: rein (kaal)
              info: |-
                Sind die Preise in HBC der reine Börsenpreis (ohne Steuern und Aufschlag), wähle **kaal**.

                Liefert HBC all-in-Preise (mit Energiesteuer, Aufschlag und MwSt), wähle **all-in**. Dann rechnet Batterijplan nichts mehr dazu und Energiesteuer + Einkauf ist nicht nötig.
            - entity: date.batterijplan_contract_start
              name: Vertragsbeginn Energievertrag
              info: |-
                Der Tag, an dem dein Vertragsjahr beginnt. Das Jahr spielt keine Rolle.

                Der Ertrag "dieses Vertragsjahr" zählt ab diesem Datum und beginnt jedes Vertragsjahr neu.
          - naam: Vertrag
            sub: Erst fest oder dynamisch, bei fest der Tarif
            rows:
            - entity: select.batterijplan_contract_soort
              name: Vertragsart
              labels:
                vast: Fest
                dynamisch: Dynamisch
              info: |-
                **Fest:** HBC geht auf Self-consumption, Batterijplan macht keinen Plan nach Preis. Du trägst deine Preise ein.

                **Dynamisch:** wie bisher: HBC auf Dynamic und Batterijplan macht den Plan.

                Batterijplan stellt HBC nur um, wenn Live an ist, und gibt deinen eigenen Stand zurück, wenn Live ausgeht.
            - entity: select.batterijplan_tarief
              name: Tarif
              name_land:
                nl: Tarif
                be: Tarif
                de: Tarif
              labels:
                enkel: Eintarif
                dubbel: Zweitarif
              labels_land:
                nl:
                  enkel: Eintarif
                  dubbel: Zweitarif
                be:
                  enkel: Eintarif
                  dubbel: Zweitarif
                de:
                  enkel: Eintarif
                  dubbel: Zweitarif
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
              reden: Nur bei einem Festvertrag
              info: |-
                **Eintarif:** ein Preis den ganzen Tag.

                **Zweitarif:** ein Normaltarif und ein Nebenzeittarif. In der Nebenzeit stellt Batterijplan HBC vorübergehend auf Charge, um nachzuladen, aber nur wenn der Unterschied zwischen Normal- und Nebenzeittarif mindestens die Schwelle von HBC beträgt (dieselbe Schwelle wie bei Dynamisch, Threshold delta); sonst bleibt HBC auf Self-consumption. Mit Flandern an ist Laden in der Nebenzeit immer erlaubt, unter der Zielgrenze. In den Niederlanden gelten Nacht, Wochenende und Feiertage als Nebenzeit.
            - entity: number.batterijplan_prijs_vast
              name: Preis pro kWh
              name_land:
                nl: Preis pro kWh
                be: Preis pro kWh
                de: Preis pro kWh
              kind: stepper
              step: 0.001
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - enkel
              reden: Nur bei Fest mit Eintarif
              info: "Was du pro kWh zahlst, inklusive Steuern und MwSt. Lieferanten nennen fünf Dezimalstellen: tippe auf die Zahl, um sie genau einzugeben."
            - entity: number.batterijplan_prijs_dag
              name: Normaltarif pro kWh
              name_land:
                nl: Normaltarif pro kWh
                be: Tagpreis pro kWh
                de: HT-Preis pro kWh
              kind: stepper
              step: 0.001
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - dubbel
              reden: Nur bei Fest mit Zweitarif
              info: Dein Normaltarif (Tagpreis, HT) pro kWh, inklusive Steuern und MwSt.
            - entity: number.batterijplan_prijs_nacht
              name: Nebenzeittarif pro kWh
              name_land:
                nl: Nebenzeittarif pro kWh
                be: Nachtpreis pro kWh
                de: NT-Preis pro kWh
              kind: stepper
              step: 0.001
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - dubbel
              reden: Nur bei Fest mit Zweitarif
              info: Dein Nebenzeittarif (Nachtpreis, NT) pro kWh, inklusive Steuern und MwSt. Zusammen mit dem Normaltarif bewertet er, was die Batterie einbringt.
            - entity: switch.batterijplan_dal_weekend
              name: Wochenende und Feiertage als Nebenzeit
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - dubbel
              reden: Nur bei Fest mit Zweitarif
              info: "An: Samstag, Sonntag und Feiertage zählen den ganzen Tag als Nebenzeit. Standard an in den Niederlanden, aus in Belgien."
            - entity: number.batterijplan_nacht_van
              name: Nacht beginnt (Uhr)
              kind: stepper
              step: 1
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - dubbel
              reden: Nur bei Fest mit Zweitarif
              info: "Ab dieser Uhrzeit ist Nebenzeit. Standard: Niederlande 23, Belgien 22. Enexis (Teil von Noord-Brabant und Limburg) beginnt um 21."
            - entity: number.batterijplan_nacht_tot
              name: Nacht endet (Uhr)
              kind: stepper
              step: 1
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - dubbel
              reden: Nur bei Fest mit Zweitarif
              info: Bis zu dieser Uhrzeit ist Nebenzeit; danach geht HBC zurück auf Self-consumption. Standard 7. In Belgien lädt HBC nur nach, wenn der erwartete Hausverbrauch Platz unter der Zielgrenze lässt.
            - entity: number.batterijplan_terugleverprijs
              name: Einspeisevergütung pro kWh
              kind: stepper
              step: 0.001
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
              reden: Nur bei einem Festvertrag
              info: "Was du pro kWh für eingespeisten Strom bekommst. HBC hat dafür keine eigene Einstellung, darum trägst du sie hier ein. Sie zählt beim Ertrag mit: Solarenergie, die die Batterie speichert, hätte sonst diese Vergütung gebracht."
          - naam: Regeln
            sub: Was Batterijplan nachsteuern darf
            rows:
            - entity: switch.batterijplan_regel_laden
              name: Zusätzliches Laden aus dem Netz
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Nur bei einem dynamischen Vertrag
              info: |-
                **An:** Batterijplan lädt zusätzlich aus dem Netz, wenn später ein Mangel für teure Viertelstunden droht, und lädt in einer günstigen Viertelstunde nicht aus dem Netz, wenn das nicht nötig ist.

                **Aus:** wie HBC: nur in den günstigen Stunden von HBC laden, und dann immer.
            - entity: switch.batterijplan_regel_ontladen
              name: Entladen außerhalb der HBC-Zeiten
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Nur bei einem dynamischen Vertrag
              info: |-
                **An:** auch in Viertelstunden entladen, die mindestens die HBC-Schwelle teurer sind, auch wenn HBC sie nicht teuer nennt.

                **Aus:** wie HBC: nur in den teuren Stunden von HBC entladen.
            - entity: switch.batterijplan_regel_vasthouden
              name: Halten für später
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Nur bei einem dynamischen Vertrag
              info: |-
                **An:** Ladung für eine Viertelstunde aufbewahren, die mindestens die HBC-Schwelle teurer ist.

                **Aus:** wie HBC: in einer teuren Viertelstunde sofort entladen.
            - entity: switch.batterijplan_regel_terugleveren
              name: Einspeisen
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Nur bei einem dynamischen Vertrag
              info: |-
                **An:** einspeisen, was sicher übrig ist, nur wenn die Vergütung mindestens die HBC-Schwelle höher ist als der günstigste spätere Einkauf.

                **Aus:** nie einspeisen.
          - naam: Experte
            sub: Nur ändern, wenn du weißt warum
            rows:
            - entity: number.batterijplan_marge
              name: Sicherheitsreserve
              info: |-
                Ladung, mit der der Plan nie rechnet, damit er nicht zu knapp plant.

                Beginne mit einer kleinen Reserve, zum Beispiel 0,3 kWh. Wird die Batterie oft zu früh leer, erhöhe die Reserve.
            - entity: number.batterijplan_opslag
              name: Energiesteuer + Einkauf (ohne MwSt)
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Nur bei einem dynamischen Vertrag
              kind: stepper
              step: 0.001
              info: |-
                Was du pro kWh zusätzlich zum reinen Börsenpreis zahlst, ohne MwSt: die Energiesteuer plus die Einkaufsgebühr deines Lieferanten (steht in deinem Vertrag).

                Tippe auf die Zahl, um sie genau einzugeben. Bei Preise von HBC = all-in ist dies nicht nötig.
            - entity: number.batterijplan_btw
              name: MwSt
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Nur bei einem dynamischen Vertrag
              info: |-
                Der Mehrwertsteuersatz, den Batterijplan auf den Einkaufspreis rechnet.

                In den Niederlanden sind das 21 %. Steht Preise von HBC auf all-in, ist das nicht nötig.
            - entity: number.batterijplan_teruglever_toeslag
              name: Einspeise-Zuschlag (ohne MwSt)
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Nur bei einem dynamischen Vertrag
              kind: stepper
              step: 0.001
              info: |-
                Was du pro kWh zusätzlich zum Börsenpreis für eingespeisten Strom erhältst, ohne MwSt. Bei einer negativen Zahl erhältst du weniger.

                Beispiel: 0,02 bedeutet Börse + 0,02 € pro kWh. Das findest du in den Bedingungen deines Vertrags.
            - entity: number.batterijplan_teruglever_bonus
              name: Einspeise-Bonus tagsüber
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Nur bei einem dynamischen Vertrag
              info: |-
                Zusätzlicher Prozentsatz, den du tagsüber (bei Sonne oder zwischen 08:00 und 17:00 Uhr) auf die Einspeisevergütung erhältst, wenn diese positiv ist.

                Beispiel: 10 % bedeutet, dass die Vergütung tagsüber 10 % höher ist. Hat dein Vertrag keinen Bonus, setze dies auf 0.
            - entity: switch.batterijplan_hbc_auto
              name: HBC-Einstellungen automatisch anpassen
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Nur bei einem dynamischen Vertrag
              info: |-
                **Aus (Standard):** Batterijplan ändert nichts in HBC. Unter HBC-Empfehlung siehst du nur die Empfehlung.

                **An:** Batterijplan stellt *cheapest hrs*, *expensive hrs* und *Solar reserved for house* in HBC selbst auf die Empfehlung ein, nur wenn der Unterschied mindestens 1 Stunde oder 0,5 kWh beträgt. Deine eigenen Werte werden zuerst gemerkt und kommen beim Ausschalten genau zurück. Jede Änderung steht im Logbuch.

                Die erste Empfehlung kommt nach 7 vollen Messtagen.
            - entity: switch.batterijplan_experiment_capaciteit
              name: Experiment Kapazität
              info: |-
                **An:** jede Nacht wird der Vortag gemessen: was die teuren Viertelstunden brauchten und was eine andere Kapazität gebracht hätte. Die Schaltfläche Kapazität steht dann rechts in der Reihe.

                **Aus:** es werden keine neuen Tage gemessen und die Schaltfläche verschwindet. Alles bereits Gemessene bleibt gespeichert (bis zu 5 Jahre) und ist wieder da, sobald du es einschaltest.
          - naam: Flandern
            sub: Kapazitätstarif (Flandern), alles in kW
            rows:
            - entity: switch.batterijplan_vlaanderen
              name: Flandern (Kapazitätstarif)
              info: "**Aus (Standard).** An: Batterijplan rechnet jede Viertelstunde für den flämischen Kapazitätstarif, führt die Monatsspitze, setzt die Importgrenze von HBC (nur bei Live an) und zeigt alle Leistungen in kW. Der Schalter ist unabhängig vom Land von Home Assistant."
            - entity: number.batterijplan_capaciteitstarief
              name: Kapazitätstarif (EUR/kW/Jahr)
              kind: stepper
              step: 1
              beschikbaar:
              - - entity: switch.batterijplan_vlaanderen
                  state:
                  - "on"
              reden: Nur mit Flandern an
              info: Was dein Netzbetreiber pro kW deiner durchschnittlichen Monatsspitze pro Jahr berechnet. Standard 55.
            - entity: number.batterijplan_eigen_grens
              name: Eigene Grenze (kW, 0 = keine)
              kind: stepper
              step: 0.1
              beschikbaar:
              - - entity: switch.batterijplan_vlaanderen
                  state:
                  - "on"
              reden: Nur mit Flandern an
              info: "Optional: eine eigene Obergrenze für deinen Netzbezug in kW. Die Zielgrenze liegt nie darunter, nie unter 2,5 kW und nie unter deiner bisherigen Monatsspitze."
      - naam: Sensoren
        melding: sensoren
        kaarten:
        - type: custom:batterijplan-velden
          title: Sensoren
          icon: batterijplan:thuisbatterij
          info: |-
            Tippe auf ein Feld: du bekommst eine Liste der Leistungssensoren in deinem Home Assistant, die wahrscheinlichsten oben, rechts mit dem, was sie jetzt melden. Tippe auf den richtigen. Tippen filtert die Liste; du kannst den Namen auch selbst eingeben.

            Es geht immer um die Leistung des **aktuellen Moments in Watt (W)**, nicht um eine Tagessumme in kWh.

            Unter jedem gewählten Namen siehst du, was dieser Sensor jetzt meldet.

            **Hausverbrauch jetzt** sollte ungefähr stimmen mit dem, was dein Haus wirklich verbraucht.
          rows:
          - entity: text.batterijplan_sensor_net
            name: Netzleistung (W)
            info: Bezug aus dem Netz ist +, Einspeisung ist −.
            pick: true
            suggest:
            - p1
            - grid
            - net
            - meter
            - dsmr
            - consumption
            - afname
            pick_hint: Bezug ist +, Einspeisung ist −. Wähle den Sensor, der jetzt die Netzleistung deines ganzen Hauses meldet.
          - entity: text.batterijplan_sensor_zon
            name: Solarleistung jetzt (W)
            info: |-
              Was alle deine Solarmodule zusammen jetzt erzeugen.

              Mehrere Wechselrichter? Erstelle einen Helfer Status mehrerer Sensoren kombinieren, mit Typ Summe.
            pick: true
            suggest:
            - pv
            - solar
            - zon
            - inverter
            - omvormer
            - opbrengst
            - production
            pick_hint: Wähle den Sensor, der meldet, was alle deine Solarmodule zusammen jetzt erzeugen.
          - entity: text.batterijplan_sensor_batterij
            name: Batterieleistung (W)
            info: |-
              Summe aller deiner Batterien, Entladen ist +.

              Bei HBC meistens sensor.house_total_battery_power.
            pick: true
            suggest:
            - house_total_battery
            - battery
            - batterij
            - accu
            pick_hint: 'Wähle die Summe aller deiner Batterien (Entladen ist +). Bei HBC meistens: house total battery power.'
          - entity: text.batterijplan_sensor_ev
            name: Wallbox (W, optional)
            info: Ladeleistung deiner Wallbox. Wird vom Hausverbrauch abgezogen. Darf leer bleiben.
            pick: true
            suggest:
            - wallbox
            - charger
            - laad
            - ev
            - charge
            pick_hint: Wähle die Ladeleistung deiner Wallbox.
          - entity: text.batterijplan_sensor_zon_vandaag
            name: Solarprognose heute (optional)
            info: Sensor mit der Solcast-Prognose für heute (kWh). Darf leer bleiben. Batterijplan findet Solcast selbst (über die Plattform, dann über bekannte Namen).
            pick: true
            suggest:
            - prognose
            - forecast
            - solcast
            pick_hint: Wähle den Sensor mit der Solarprognose für heute.
          - entity: text.batterijplan_sensor_zon_morgen
            name: Solarprognose morgen (optional)
            info: Sensor mit der Solcast-Prognose für morgen (kWh). Darf leer bleiben. Batterijplan findet Solcast selbst (über die Plattform, dann über bekannte Namen).
            pick: true
            suggest:
            - prognose
            - forecast
            - solcast
            pick_hint: Wähle den Sensor mit der Solarprognose für morgen.
          - type: section
            name: Kontrolle
          - entity: sensor.batterijplan_huisverbruik
            name: Hausverbrauch jetzt
            info: Netzleistung + Solarleistung + Batterieleistung − Wallbox. Sollte ungefähr stimmen mit dem, was dein Haus wirklich verbraucht, und ist nie negativ.
      - naam: Spitze
        toon: switch.batterijplan_vlaanderen
        breed: 820
        kaarten:
        - type: custom:batterijplan-kwartier
        - type: custom:batterijplan-piek
      - naam: Kapazität
        experiment: true
        toon: switch.batterijplan_experiment_capaciteit
        breed: 820
        kaarten:
        - type: custom:batterijplan-capaciteit
  - type: grid
    cards:
    - type: custom:batterijplan-status
  - type: grid
    column_span: 2
    cards:
    - type: custom:batterijplan-plan-card
      weergave: briefing
      grid_options:
        columns: full
  - type: grid
    column_span: 4
    cards:
    - type: custom:batterijplan-plan-card
      weergave: samen
      grid_options:
        columns: full
  badges: []
