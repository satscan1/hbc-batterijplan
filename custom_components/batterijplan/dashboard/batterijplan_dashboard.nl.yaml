# Ingebouwd dashboard van Batterijplan (Nederlands). Kaarten: custom:batterijplan-*; geleverd door de integratie.
# De kaarttaal volgt het profiel (optioneel per kaart: taal: nl|en|de).
title: Batterijplan
views:
- title: Batterijplan
  path: batterijplan
  icon: mdi:battery-clock
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:batterijplan-knoppen
      live: switch.batterijplan_live
      knoppen:
      - naam: Opbrengst
        kaarten:
        - type: custom:batterijplan-opbrengst
          title: Wat levert het op
          icon: batterijplan:euro
          perioden: true
      - naam: Vandaag
        breed: 820
        kaarten:
        - type: custom:batterijplan-dag-card
        - type: custom:batterijplan-spaarlijn-card
        - type: custom:batterijplan-dagen-card
      - naam: Rapport
        kaarten:
        - type: custom:batterijplan-rapport
          title: Rapport
          icon: batterijplan:info
        breed: 820
      - naam: Advies HBC
        melding: advies
        kaarten:
        - type: custom:batterijplan-advies
          title: Advies voor HBC
          icon: batterijplan:schuifregelaars
      - naam: Instellingen
        melding: instellingen
        kaarten:
        - type: custom:batterijplan-velden
          title: Instellingen
          icon: batterijplan:schuifregelaars
          info: |-
            Hier stel je Batterijplan in op jouw batterijen en je energiecontract.

            **Basis** vul je één keer in. **Expert** hoef je meestal niet aan te passen.

            Ontbreekt er iets essentieels, dan krijgt het knopje Instellingen een oranje stip.

            Alle waarden worden door de integratie bewaard en blijven staan bij een herstart en bij een nieuwe versie.
          tabs:
          - naam: Basis
            sub: Instellen en vergeten
            rows:
            - entity: number.batterijplan_capaciteit
              name: Bruikbare capaciteit batterijen
              info: |-
                Wat je batterijen samen écht kunnen leveren, boven de ondergrens die in HBC staat.

                Voorbeeld: 2 batterijen van 5 kWh met 10 % ondergrens ≈ 9,0 kWh.

                Zolang dit niet is ingevuld, doet het plan niets.
            - entity: select.batterijplan_hbc_prijzen
              name: Prijzen van HBC
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Alleen bij een dynamisch contract
              info: |-
                Staan de prijzen in HBC als kale beursprijs (zonder belasting en opslag), kies **kaal**.

                Geeft HBC all-in prijzen (met energiebelasting, opslag en btw), kies **all-in**. Dan telt Batterijplan zelf niets meer op en is Energiebelasting + inkoop niet nodig.
            - entity: date.batterijplan_contract_start
              name: Ingangsdatum energiecontract
              info: |-
                De dag waarop je contractjaar begint. Het jaartal maakt niet uit.

                De opbrengst "dit contractjaar" telt vanaf deze datum en begint elk contractjaar opnieuw.
          - naam: Contract
            sub: Eerst vast of dynamisch, bij vast het tarief
            rows:
            - entity: select.batterijplan_contract_soort
              name: Soort contract
              labels:
                vast: Vast
                dynamisch: Dynamisch
              info: |-
                **Vast:** HBC gaat op Self-consumption, Batterijplan maakt geen plan op prijs. Jij vult je prijzen in.

                **Dynamisch:** zoals voorheen: HBC op Dynamic en Batterijplan maakt het plan.

                Batterijplan zet HBC alleen om als Live aanstaat en geeft jouw eigen stand terug als Live uitgaat.
            - entity: select.batterijplan_tarief
              name: Tarief
              name_land:
                nl: Tarief
                be: Tarief
                de: Tarif
              labels:
                enkel: Enkeltarief
                dubbel: Dubbeltarief
              labels_land:
                nl:
                  enkel: Enkeltarief
                  dubbel: Dubbeltarief
                be:
                  enkel: Enkelvoudig
                  dubbel: Tweevoudig
                de:
                  enkel: Eintarif
                  dubbel: Zweitarif
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
              reden: Alleen bij een vast contract
              info: |-
                **Enkeltarief:** één prijs de hele dag.

                **Dubbeltarief:** een normaaltarief en een daltarief. In de daluren zet Batterijplan HBC tijdelijk op Charge om bij te laden, maar alleen als het verschil tussen normaaltarief en daltarief minstens de drempel van HBC is (dezelfde drempel als bij Dynamisch, Threshold delta); anders blijft HBC op Self-consumption. Met Vlaanderen aan mag laden in het dal altijd, onder de doelgrens. Bij Nederland tellen de nacht, het weekend en erkende feestdagen als dal.
            - entity: number.batterijplan_prijs_vast
              name: Prijs per kWh
              name_land:
                nl: Prijs per kWh
                be: Prijs per kWh
                de: Preis pro kWh
              kind: stepper
              step: 0.001
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - enkel
              reden: Alleen bij Vast met een enkel tarief
              info: "Wat je per kWh betaalt, inclusief belastingen en btw. Energieleveranciers geven vijf decimalen: tik op het getal om hem precies te typen."
            - entity: number.batterijplan_prijs_dag
              name: Normaaltarief per kWh
              name_land:
                nl: Normaaltarief per kWh
                be: Dagprijs per kWh
                de: HT-Preis pro kWh
              kind: stepper
              step: 0.001
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - dubbel
              reden: Alleen bij Vast met een dubbel tarief
              info: Je normaaltarief (dagprijs, HT) per kWh, inclusief belastingen en btw.
            - entity: number.batterijplan_prijs_nacht
              name: Daltarief per kWh
              name_land:
                nl: Daltarief per kWh
                be: Nachtprijs per kWh
                de: NT-Preis pro kWh
              kind: stepper
              step: 0.001
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - dubbel
              reden: Alleen bij Vast met een dubbel tarief
              info: Je daltarief (nachtprijs, NT) per kWh, inclusief belastingen en btw. Samen met het normaaltarief waardeert het wat de batterij oplevert in Wat levert het op.
            - entity: switch.batterijplan_dal_weekend
              name: Weekend en feestdagen als daluren
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - dubbel
              reden: Alleen bij Vast met een dubbel tarief
              info: "Aan: zaterdag, zondag en erkende feestdagen (NL: 1 jan, 2e paasdag, Koningsdag, Hemelvaart, 2e pinksterdag, 1e en 2e kerstdag) tellen de hele dag als dal. Standaard aan bij Nederland, uit bij België."
            - entity: number.batterijplan_nacht_van
              name: Nacht begint (uur)
              kind: stepper
              step: 1
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - dubbel
              reden: Alleen bij Vast met een dubbel tarief
              info: "Vanaf dit uur is het dal. Standaard: Nederland 23, België 22. Enexis (deel van Noord-Brabant en Limburg) begint om 21."
            - entity: number.batterijplan_nacht_tot
              name: Nacht eindigt (uur)
              kind: stepper
              step: 1
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
                - entity: select.batterijplan_tarief
                  state:
                  - dubbel
              reden: Alleen bij Vast met een dubbel tarief
              info: Tot dit uur is het dal; daarna gaat HBC terug naar Self-consumption. Standaard 7. In België laadt HBC alleen bij als het verwachte huisverbruik ruimte laat onder de doelgrens, en de importgrens houdt het laden eronder.
            - entity: number.batterijplan_terugleverprijs
              name: Terugleververgoeding per kWh
              kind: stepper
              step: 0.001
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - vast
              reden: Alleen bij een vast contract
              info: "Wat je per kWh krijgt voor teruggeleverde stroom. HBC heeft hier zelf geen instelling voor, daarom vul je hem hier in. Hij telt mee in Wat levert het op: zonne-energie die de batterij opslaat, had anders deze vergoeding opgeleverd."
          - naam: Regels
            sub: Wat Batterijplan mag bijsturen
            rows:
            - entity: switch.batterijplan_regel_laden
              name: Extra laden van het net
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Alleen bij een dynamisch contract
              info: |-
                **Aan:** Batterijplan laadt van het net bij als er later een tekort komt voor dure kwartieren, en laadt in een goedkoop kwartier niet van het net als dat niet nodig is.

                **Uit:** zoals HBC: alleen laden in de goedkope uren van HBC, en dan altijd.
            - entity: switch.batterijplan_regel_ontladen
              name: Ontladen buiten HBC-uren
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Alleen bij een dynamisch contract
              info: |-
                **Aan:** ook ontladen in kwartieren die minstens de drempel van HBC duurder zijn, ook als HBC ze niet duur noemt.

                **Uit:** zoals HBC: alleen ontladen in de dure uren van HBC.
            - entity: switch.batterijplan_regel_vasthouden
              name: Vasthouden voor later
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Alleen bij een dynamisch contract
              info: |-
                **Aan:** lading bewaren voor een kwartier dat minstens de drempel van HBC duurder is.

                **Uit:** zoals HBC: in een duur kwartier direct ontladen.
            - entity: switch.batterijplan_regel_terugleveren
              name: Terugleveren
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Alleen bij een dynamisch contract
              info: |-
                **Aan:** terugleveren wat zeker over is, alleen als de vergoeding minstens de drempel van HBC hoger is dan de goedkoopste inkoop verderop.

                **Uit:** nooit terugleveren.
          - naam: Expert
            sub: Alleen aanpassen als je weet waarom
            rows:
            - entity: number.batterijplan_marge
              name: Veiligheidsmarge
              info: |-
                Lading die het plan nooit inrekent, zodat het niet te krap plant.

                Begin met een kleine marge, bijvoorbeeld 0,3 kWh. Raakt de batterij vaak te vroeg leeg, verhoog dan de marge.
            - entity: number.batterijplan_opslag
              name: Energiebelasting + inkoop (excl. btw)
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Alleen bij een dynamisch contract
              kind: stepper
              step: 0.001
              info: |-
                Wat je per kWh bóvenop de kale beursprijs betaalt, zonder btw: de energiebelasting plus de inkoopvergoeding van je leverancier (staat op je contract).

                Tik op het getal om het precies te typen. Bij Prijzen van HBC = all-in is dit niet nodig.
            - entity: number.batterijplan_btw
              name: Btw
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Alleen bij een dynamisch contract
              info: |-
                Het btw-percentage dat Batterijplan over de inkoopprijs rekent.

                In Nederland is dat 21 %. Staat Prijzen van HBC op all-in, dan is dit niet nodig.
            - entity: number.batterijplan_teruglever_toeslag
              name: Teruglever-toeslag (excl. btw)
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Alleen bij een dynamisch contract
              kind: stepper
              step: 0.001
              info: |-
                Wat je per kWh bovenop de beursprijs ontvangt voor teruggeleverde stroom, zonder btw. Bij een negatief getal ontvang je minder.

                Voorbeeld: 0,02 betekent beurs + € 0,02 per kWh. Je vindt dit bij de voorwaarden van je contract.
            - entity: number.batterijplan_teruglever_bonus
              name: Teruglever-bonus overdag
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Alleen bij een dynamisch contract
              info: |-
                Extra percentage dat je overdag (met zon, of tussen 08:00 en 17:00) bovenop de terugleververgoeding krijgt, als die positief is.

                Voorbeeld: 10 % betekent dat de vergoeding overdag 10 % hoger is. Heeft je contract geen bonus, zet dit dan op 0.
            - entity: switch.batterijplan_hbc_auto
              name: HBC-instellingen automatisch
              beschikbaar:
              - - entity: select.batterijplan_contract_soort
                  state:
                  - dynamisch
              reden: Alleen bij een dynamisch contract
              info: |-
                **Uit (standaard):** Batterijplan verandert niets in HBC. Onder Advies HBC zie je alleen het advies.

                **Aan:** Batterijplan zet *cheapest hrs*, *expensive hrs* en *Solar reserved for house* in HBC zelf op het advies, alleen als het verschil minstens 1 uur of 0,5 kWh is. Jouw eigen waarden worden eerst onthouden en komen exact terug als je dit weer uitzet. Elke wijziging staat in het logboek.

                Er komt pas een advies na 7 volle dagen meten.
            - entity: switch.batterijplan_experiment_capaciteit
              name: Experiment capaciteit
              info: |-
                **Aan:** elke nacht wordt de vorige dag gemeten: hoeveel de dure kwartieren nodig hadden en wat een andere capaciteit had opgeleverd. De knop Capaciteit staat dan rechts in de rij.

                **Uit:** er worden geen nieuwe dagen gemeten en de knop verdwijnt. Alles wat al gemeten is blijft bewaard (tot 5 jaar) en is terug zodra je hem weer aanzet.
          - naam: Vlaanderen
            sub: Capaciteitstarief (Vlaanderen), alles in kW
            rows:
            - entity: switch.batterijplan_vlaanderen
              name: Vlaanderen (capaciteitstarief)
              info: "**Uit (standaard).** Aan: Batterijplan rekent elk kwartier mee voor het Vlaamse capaciteitstarief, houdt de maandpiek bij, zet de importgrens van HBC (alleen als Live aanstaat) en toont alle vermogens in kW. Deze schakelaar staat los van het land van Home Assistant."
            - entity: number.batterijplan_capaciteitstarief
              name: Capaciteitstarief (€/kW/jaar)
              kind: stepper
              step: 1
              beschikbaar:
              - - entity: switch.batterijplan_vlaanderen
                  state:
                  - "on"
              reden: Alleen met Vlaanderen aan
              info: Wat je netbeheerder per kW van je gemiddelde maandpiek per jaar rekent. Standaard 55.
            - entity: number.batterijplan_eigen_grens
              name: Eigen grens (kW, 0 = geen)
              kind: stepper
              step: 0.1
              beschikbaar:
              - - entity: switch.batterijplan_vlaanderen
                  state:
                  - "on"
              reden: Alleen met Vlaanderen aan
              info: "Optioneel: een eigen bovengrens voor je netafname in kW. De doelgrens is nooit lager dan deze waarde, dan 2,5 kW of je maandpiek tot nu."
      - naam: Sensoren
        melding: sensoren
        kaarten:
        - type: custom:batterijplan-velden
          title: Sensoren
          icon: batterijplan:thuisbatterij
          info: |-
            Tik op een veld: je krijgt een lijst met de vermogenssensoren uit jouw Home Assistant, de meest waarschijnlijke bovenaan, met rechts wat ze nu melden. Tik op de juiste. Typen filtert de lijst; je mag de naam ook helemaal zelf typen.

            Het gaat steeds om het vermogen van **dit moment in watt (W)**, geen dagtotaal in kWh.

            Onder elke gekozen naam zie je wat die sensor nu meldt.

            **Huisverbruik nu** moet ongeveer kloppen met wat je huis echt gebruikt.
          rows:
          - entity: text.batterijplan_sensor_net
            name: Netvermogen (W)
            info: Afname van het net is +, teruglevering is −.
            pick: true
            suggest:
            - p1
            - grid
            - net
            - meter
            - dsmr
            - consumption
            - afname
            pick_hint: Afname is +, teruglevering is −. Kies de sensor die nu het netvermogen van je hele huis meldt.
          - entity: text.batterijplan_sensor_zon
            name: Zonnevermogen nu (W)
            info: |-
              Wat al je zonnepanelen samen nu opwekken.

              Meerdere omvormers? Maak een helper Combineer de status van meerdere sensoren, met type Som.
            pick: true
            suggest:
            - pv
            - solar
            - zon
            - inverter
            - omvormer
            - opbrengst
            - production
            pick_hint: Kies de sensor met wat al je zonnepanelen samen nu opwekken.
          - entity: text.batterijplan_sensor_batterij
            name: Batterijvermogen (W)
            info: |-
              Totaal van al je batterijen, ontladen is +.

              Bij HBC meestal sensor.house_total_battery_power.
            pick: true
            suggest:
            - house_total_battery
            - battery
            - batterij
            - accu
            pick_hint: 'Kies het totaal van al je batterijen (ontladen is +). Bij HBC meestal: house total battery power.'
          - entity: text.batterijplan_sensor_ev
            name: Laadpaal (W, optioneel)
            info: Laadvermogen van je auto-lader. Wordt van het huisverbruik afgetrokken. Mag leeg blijven.
            pick: true
            suggest:
            - wallbox
            - charger
            - laad
            - ev
            - charge
            pick_hint: Kies het laadvermogen van je auto-lader.
          - entity: text.batterijplan_sensor_zon_vandaag
            name: Zonvoorspelling vandaag (optioneel)
            info: Sensor met de Solcast-verwachting voor vandaag (kWh). Mag leeg blijven. Batterijplan zoekt Solcast zelf (op platform, daarna op bekende namen).
            pick: true
            suggest:
            - voorspelling
            - forecast
            - prognose
            pick_hint: Kies de sensor met de zonvoorspelling voor vandaag.
          - entity: text.batterijplan_sensor_zon_morgen
            name: Zonvoorspelling morgen (optioneel)
            info: Sensor met de Solcast-verwachting voor morgen (kWh). Mag leeg blijven. Batterijplan zoekt Solcast zelf (op platform, daarna op bekende namen).
            pick: true
            suggest:
            - voorspelling
            - forecast
            - prognose
            pick_hint: Kies de sensor met de zonvoorspelling voor morgen.
          - type: section
            name: Controle
          - entity: sensor.batterijplan_huisverbruik
            name: Huisverbruik nu
            info: Netvermogen + zonnevermogen + batterijvermogen − laadpaal. Moet ongeveer kloppen met wat je huis echt gebruikt, en is nooit negatief.
      - naam: Piek
        toon: switch.batterijplan_vlaanderen
        breed: 820
        kaarten:
        - type: custom:batterijplan-kwartier
        - type: custom:batterijplan-piek
      - naam: Capaciteit
        experiment: true
        toon: switch.batterijplan_experiment_capaciteit
        breed: 820
        kaarten:
        - type: custom:batterijplan-capaciteit
  - type: grid
    cards:
    - type: custom:batterijplan-status
  - type: grid
    column_span: 2
    cards:
    - type: custom:batterijplan-plan-card
      weergave: briefing
      grid_options:
        columns: full
  - type: grid
    column_span: 4
    cards:
    - type: custom:batterijplan-plan-card
      weergave: samen
      grid_options:
        columns: full
  badges: []
