# Batterijplan v1.0.0-rc1 — Dashboard (Deutsch)
# Einfügen in: Einstellungen → Dashboards → (dein Dashboard) → Bearbeiten (Stift) → ⋮ → Raw-Konfigurationseditor
# Nötig: die Karten (www/batterijplan/batterijplan-cards.js) als Dashboard-Ressource, siehe docs/01-installation.de.md.
title: Batterijplan
views:
- title: Batterijplan
  path: batterijplan
  icon: mdi:battery-clock
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:batterijplan-knoppen
      live: input_boolean.batterijplan_live
      knoppen:
      - naam: Ertrag
        kaarten:
        - type: custom:batterijplan-opbrengst
          title: Was bringt es
          icon: batterijplan:euro
      - naam: HBC-Empfehlung
        melding: advies
        kaarten:
        - type: custom:batterijplan-advies
          title: Empfehlung für HBC
          icon: batterijplan:schuifregelaars
      - naam: Einstellungen
        melding: instellingen
        kaarten:
        - type: custom:batterijplan-velden
          title: Einstellungen
          icon: batterijplan:schuifregelaars
          info: |-
            Hier stellst du Batterijplan auf deine Batterien und deinen Energievertrag ein.

            **Basis** füllst du einmal aus. **Experte** musst du meistens nicht ändern.

            Fehlt etwas Wichtiges, bekommt der Knopf Einstellungen einen orangen Punkt.

            Mache nach dem Ausfüllen eine **Sicherung**. Sie bleibt bei einem Neustart und einer neuen Version erhalten.
          tabs:
          - naam: Basis
            sub: Einstellen und vergessen
            rows:
            - entity: input_number.batterijplan_capaciteit
              name: Nutzbare Batteriekapazität
              info: |-
                Was deine Batterien zusammen wirklich liefern können, oberhalb der Untergrenze in HBC.

                Beispiel: 2 Batterien mit 5,12 kWh und 12 % Untergrenze ≈ 9,0 kWh.

                Solange dies nicht ausgefüllt ist, tut der Plan nichts.
            - entity: input_select.batterijplan_hbc_prijzen
              name: Preise von HBC
              info: |-
                Gibt HBC den reinen Börsenpreis (ohne Steuer und Aufschlag), wähle **kaal** (niederländisch für ohne Aufschläge).

                Gibt HBC All-in-Preise (mit Energiesteuer, Aufschlag und MwSt.), wähle **all-in**. Dann rechnet Batterijplan selbst nichts mehr dazu, und Energiesteuer + Einkauf wird nicht gebraucht.
            - entity: input_datetime.batterijplan_contract_start
              name: Beginn des Energievertrags
              info: |-
                Der Tag, an dem dein Vertragsjahr beginnt. Das Jahr spielt keine Rolle.

                Der Ertrag "diese Energieperiode" zählt ab diesem Datum und beginnt jedes Vertragsjahr neu.
            - type: section
              name: Sicherung
            - type: buttons
              buttons:
              - name: Sicherung erstellen
                entity: input_button.batterijplan_backup
              - name: Sicherung wiederherstellen
                entity: input_button.batterijplan_terugzetten
                confirm: true
              - name: Standardwerte
                entity: input_button.batterijplan_standaard
                confirm: true
              name: Einstellungen sichern
              info: |-
                **Sicherung erstellen** speichert alle diese Einstellungen, auch die Sensoren.

                **Sicherung wiederherstellen** setzt alles aus der letzten Sicherung zurück, zum Beispiel nach einer Neuinstallation oder einem Fehler.

                **Standardwerte** setzt Sicherheitsreserve und Wirkungsgrad auf 0,3 kWh und 75 % zurück. Vorher wird eine Sicherung erstellt, du kannst es also rückgängig machen.

                Beim Wiederherstellen und bei den Standardwerten fragt der Knopf zuerst: Sicher?
            - type: backup
          - naam: Experte
            sub: Nur ändern, wenn du weißt warum
            rows:
            - entity: input_number.batterijplan_marge
              name: Sicherheitsreserve
              info: |-
                Ladung, die der Plan nie einrechnet, damit er nicht zu knapp plant.

                0,3 kWh ist ein guter Anfang. Ist die Batterie oft zu früh leer, erhöhe die Reserve.
            - entity: input_number.batterijplan_rendement
              name: Wirkungsgrad Laden + Entladen
              info: |-
                Wie viel Prozent der geladenen Energie wieder herauskommt.

                Nicht sicher? Beginne mit 75 %.
            - entity: input_number.batterijplan_opslag
              name: Energiesteuer + Einkauf (ohne MwSt.)
              kind: stepper
              step: 0.001
              info: |-
                Was du pro kWh zusätzlich zum reinen Börsenpreis zahlst, ohne MwSt.: die Energiesteuer plus die Einkaufsgebühr deines Anbieters (steht im Vertrag).

                Beispiel (Niederlande 2026): 0,09161 + 0,0165 = 0,1081.

                Tippe auf die Zahl, um sie genau einzugeben. Bei Preise von HBC = all-in nicht nötig.
      - naam: Sensoren
        melding: sensoren
        kaarten:
        - type: custom:batterijplan-velden
          title: Sensoren
          icon: batterijplan:thuisbatterij
          info: |-
            Tippe auf ein Feld: du bekommst eine Liste der Leistungssensoren in deinem Home Assistant, die wahrscheinlichsten oben, rechts mit dem, was sie gerade melden. Tippe auf den richtigen. Tippen filtert die Liste; du kannst den Namen auch ganz selbst eingeben.

            Es geht immer um die Leistung **in diesem Moment in Watt (W)**, keine Tagessumme in kWh.

            Unter jedem gewählten Namen siehst du, was dieser Sensor gerade meldet.

            **Hausverbrauch jetzt** sollte ungefähr zu dem passen, was dein Haus wirklich verbraucht.
          rows:
          - entity: input_text.batterijplan_sensor_net
            name: Netzleistung (W)
            info: Bezug aus dem Netz ist +, Einspeisung ist −.
            pick: true
            suggest:
            - p1
            - grid
            - net
            - meter
            - dsmr
            - consumption
            - afname
            pick_hint: Bezug ist +, Einspeisung ist −. Wähle den Sensor, der gerade die Netzleistung deines ganzen Hauses meldet.
          - entity: input_text.batterijplan_sensor_zon
            name: Solarleistung jetzt (W)
            info: |-
              Was alle deine Solarmodule zusammen gerade erzeugen.

              Mehrere Wechselrichter? Erstelle einen Helfer Status mehrerer Sensoren kombinieren, mit Typ Summe.
            pick: true
            suggest:
            - pv
            - solar
            - zon
            - inverter
            - omvormer
            - opbrengst
            - production
            pick_hint: Wähle den Sensor mit dem, was alle deine Solarmodule zusammen gerade erzeugen.
          - entity: input_text.batterijplan_sensor_batterij
            name: Batterieleistung (W)
            info: |-
              Summe aller deiner Batterien, Entladen ist +.

              Bei HBC meist sensor.house_total_battery_power.
            pick: true
            suggest:
            - house_total_battery
            - battery
            - batterij
            - accu
            - marstek
            pick_hint: 'Wähle die Summe aller deiner Batterien (Entladen ist +). Bei HBC meist: house total battery power.'
          - entity: input_text.batterijplan_sensor_ev
            name: Wallbox (W, optional)
            info: Ladeleistung deiner Wallbox. Wird vom Hausverbrauch abgezogen. Darf leer bleiben.
            pick: true
            suggest:
            - wallbox
            - charger
            - laad
            - ev
            - charge
            pick_hint: Wähle die Ladeleistung deiner Wallbox.
          - type: section
            name: Kontrolle
          - entity: sensor.batterijplan_huisverbruik
            name: Hausverbrauch jetzt
            info: Netzleistung + Solarleistung + Batterieleistung − Wallbox. Sollte ungefähr zu dem passen, was dein Haus wirklich verbraucht, und ist nie negativ.
  - type: grid
    cards:
    - type: custom:batterijplan-status
  - type: grid
    column_span: 2
    cards:
    - type: custom:batterijplan-plan
      title: Plan heute und morgen
      icon: batterijplan:kalender-klok
  - type: grid
    column_span: 3
    cards:
    - type: custom:batterijplan-grafiek
      title: Preis und Batterie
      icon: batterijplan:euro-klok
      datumkiezer: true
      height: 240
      vergelijk: true
