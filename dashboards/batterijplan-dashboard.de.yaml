      title: Sensoren
      grid_options:
        columns: full
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: input_boolean.batterijplan_toon_instellingen
          state: 'on'
        - condition: state
          entity: input_text.batterijplan_sensor_net
          state:
          - ''
          - unknown
        - condition: numeric_state
          entity: input_number.batterijplan_capaciteit
          below: 1.05
      entities:
      - entity: input_text.batterijplan_sensor_net
        name: Netzleistung (W)
      - entity: input_text.batterijplan_sensor_zon
        name: Solarleistung jetzt (W)
      - entity: input_text.batterijplan_sensor_batterij
        name: Speicherleistung (W)
      - entity: input_text.batterijplan_sensor_ev
        name: Wallbox (W, optional)
      - entity: sensor.batterijplan_huisverbruik
        name: 'Kontrolle: Hausverbrauch jetzt'
    - type: markdown
      grid_options:
        columns: full
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: input_boolean.batterijplan_toon_instellingen
          state: 'on'
        - condition: state
          entity: input_text.batterijplan_sensor_net
          state:
          - ''
          - unknown
        - condition: numeric_state
          entity: input_number.batterijplan_capaciteit
          below: 1.05
      content: |-
        <sub><img src="/local/batterijplan/info.png?v=1" height="22" alt=""></sub> **Was trägst du ein?**

        | | |
        |---|---|
        | **Live** | Aus = Schatten: Der Plan rechnet nur mit. An = Der Plan steuert HBC in den teuren Viertelstunden. |
        | **Nutzbare Kapazität** | Was deine Speicher zusammen wirklich liefern können, oberhalb der Untergrenze, die in HBC steht. Beispiel: 2 Speicher mit 5,12 kWh und 12 % Untergrenze ≈ 9,0 kWh. Solange das nicht ausgefüllt ist, tut der Plan nichts. |
        | **Sicherheitsreserve** | Ladung, die der Plan nie einrechnet, damit er nicht zu knapp plant. 0,3 kWh ist ein guter Anfang. |
        | **Wirkungsgrad** | Wie viel % des geladenen Stroms wieder herauskommt. Weißt du es nicht? Fang mit 75 % an. |
        | **Energiesteuer + Einkaufsaufschlag** | Was du pro kWh **zusätzlich** zum Börsenpreis zahlst, ohne MwSt.: die Energiesteuer (in den Niederlanden 2026: € 0,09161) plus den Einkaufsaufschlag deines Anbieters (steht in deinem Vertrag). Beispiel: 0,09161 + 0,0165 = 0,1081. Nur für die Empfehlung zum nächtlichen Laden verwendet. |
        | **Sensoren** | Tippe den Namen deines eigenen Sensors ein, z. B. `sensor.p1_vermogen`. Immer die Leistung von **genau jetzt in Watt (W)**, keine Tagessumme in kWh. |
        | – Netz | Bezug aus dem Netz ist +, Einspeisung ist −. |
        | – Sonne | Was alle deine Solarpaneele zusammen jetzt erzeugen. Mehrere Wechselrichter? Lege einen Helfer *Den Zustand mehrerer Sensoren kombinieren* mit Typ *Summe* an. |
        | – Speicher | Summe aller deiner Speicher, entladen ist +. Bei HBC meist `sensor.house_total_battery_power`. |
        | – Wallbox | Ladeleistung deiner Wallbox. Darf leer bleiben. |
        | **Kontrolle** | *Hausverbrauch jetzt* muss ungefähr zu dem passen, was dein Haus wirklich verbraucht. |
        | **Back-up** | *Back-up erstellen* speichert alle diese Einstellungen. Nach einer Neuinstallation oder einem Versehen stellt *Back-up wiederherstellen* alles wieder her. Das Back-up bleibt bei einem Neustart und einer neuen Version erhalten. |
        | **Standardwerte** | Setzt die Sicherheitsreserve und den Wirkungsgrad auf 0,3 kWh und 75 % zurück. Vorher wird ein Back-up erstellt. |

        Alles eingerichtet? Schalte den Schalter *Einstellungen* aus, dann verschwinden die Werte, die Sensoren und diese Erklärung. Solange etwas fehlt, bleiben sie von selbst stehen.
