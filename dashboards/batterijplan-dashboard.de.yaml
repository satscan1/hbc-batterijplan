            text: Sicherheitsreserve und Wirkungsgrad auf die Standardwerte (0,3 kWh und 75 %) zurücksetzen? Vorher wird ein Back-up erstellt, du kannst das also mit "Back-up wiederherstellen" rückgängig machen.
