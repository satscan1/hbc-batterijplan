# Batterijplan v1.0.0-rc1 — dashboard (English)
# Paste into: Settings → Dashboards → (your dashboard) → edit (pencil) → ⋮ → Raw configuration editor
# Needed: the cards (www/batterijplan/batterijplan-cards.js) as a dashboard resource, see docs/01-installation.md.
title: Batterijplan
views:
- title: Batterijplan
  path: batterijplan
  icon: mdi:battery-clock
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:batterijplan-knoppen
      live: input_boolean.batterijplan_live
      knoppen:
      - naam: Earnings
        kaarten:
        - type: custom:batterijplan-opbrengst
          title: What does it earn
          icon: batterijplan:euro
      - naam: HBC advice
        melding: advies
        kaarten:
        - type: custom:batterijplan-advies
          title: Advice for HBC
          icon: batterijplan:schuifregelaars
      - naam: Settings
        melding: instellingen
        kaarten:
        - type: custom:batterijplan-velden
          title: Settings
          icon: batterijplan:schuifregelaars
          info: |-
            Here you set Batterijplan up for your batteries and your energy contract.

            **Basic** is filled in once. **Expert** usually does not need changing.

            If something essential is missing, the Settings button gets an orange dot.

            Make a **back-up** after filling in. It is kept through a restart and a new version.
          tabs:
          - naam: Basic
            sub: Set and forget
            rows:
            - entity: input_number.batterijplan_capaciteit
              name: Usable battery capacity
              info: |-
                What your batteries together can really deliver, above the lower limit set in HBC.

                Example: 2 batteries of 5.12 kWh with a 12 % lower limit ≈ 9.0 kWh.

                As long as this is not filled in, the plan does nothing.
            - entity: input_select.batterijplan_hbc_prijzen
              name: Prices from HBC
              info: |-
                If HBC gives the bare exchange price (without tax and mark-up), choose **kaal** (bare).

                If HBC gives all-in prices (with energy tax, mark-up and VAT), choose **all-in**. Batterijplan then adds nothing itself, and Energy tax + purchase fee is not needed.
            - entity: input_datetime.batterijplan_contract_start
              name: Energy contract start date
              info: |-
                The day your contract year starts. The year does not matter.

                The earnings for "this energy period" count from this date and start again every contract year.
            - type: section
              name: Back-up
            - type: buttons
              buttons:
              - name: Make back-up
                entity: input_button.batterijplan_backup
              - name: Restore back-up
                entity: input_button.batterijplan_terugzetten
                confirm: true
              - name: Defaults
                entity: input_button.batterijplan_standaard
                confirm: true
              name: Keep settings
              info: |-
                **Make back-up** saves all these settings, including the sensors.

                **Restore back-up** puts everything back from the last back-up, for example after a reinstall or a mistake.

                **Defaults** sets the safety margin and efficiency back to 0.3 kWh and 75 %. A back-up is made first, so you can undo this.

                For restore and defaults the button first asks: Sure?
            - type: backup
          - naam: Expert
            sub: Only change if you know why
            rows:
            - entity: input_number.batterijplan_marge
              name: Safety margin
              info: |-
                Charge the plan never counts on, so it does not plan too tightly.

                0.3 kWh is a good start. If the battery often runs empty too early, raise the margin.
            - entity: input_number.batterijplan_rendement
              name: Round-trip efficiency
              info: |-
                How many percent of the charged energy comes back out.

                Not sure? Start with 75 %.
            - entity: input_number.batterijplan_opslag
              name: Energy tax + purchase fee (excl. VAT)
              kind: stepper
              step: 0.001
              info: |-
                What you pay per kWh on top of the bare exchange price, without VAT: the energy tax (2026: € 0.09161) plus your supplier's purchase fee (on your contract).

                Example: 0.09161 + 0.0165 = 0.1081.

                Tap the number to type it exactly. Not needed when Prices from HBC = all-in.
      - naam: Sensors
        melding: sensoren
        kaarten:
        - type: custom:batterijplan-velden
          title: Sensors
          icon: batterijplan:thuisbatterij
          info: |-
            Tap a field: you get a list of the power sensors in your Home Assistant, the most likely at the top, with what they report now on the right. Tap the right one. Typing filters the list; you can also type the full name yourself.

            It is always the power **at this moment in watts (W)**, not a daily total in kWh.

            Below each chosen name you see what that sensor reports now.

            **House consumption now** should roughly match what your house really uses.
          rows:
          - entity: input_text.batterijplan_sensor_net
            name: Grid power (W)
            info: Import from the grid is +, export is −.
            pick: true
            suggest:
            - p1
            - grid
            - net
            - meter
            - dsmr
            - consumption
            - afname
            pick_hint: Import is +, export is −. Pick the sensor that reports the grid power of your whole house now.
          - entity: input_text.batterijplan_sensor_zon
            name: Solar power now (W)
            info: |-
              What all your solar panels together produce right now.

              Several inverters? Create a helper Combine the state of several sensors, with type Sum.
            pick: true
            suggest:
            - pv
            - solar
            - zon
            - inverter
            - omvormer
            - opbrengst
            - production
            pick_hint: Pick the sensor with what all your solar panels together produce now.
          - entity: input_text.batterijplan_sensor_batterij
            name: Battery power (W)
            info: |-
              Total of all your batteries, discharging is +.

              With HBC usually sensor.house_total_battery_power.
            pick: true
            suggest:
            - house_total_battery
            - battery
            - batterij
            - accu
            - marstek
            pick_hint: 'Pick the total of all your batteries (discharging is +). With HBC usually: house total battery power.'
          - entity: input_text.batterijplan_sensor_ev
            name: Charger (W, optional)
            info: Charging power of your EV charger. It is subtracted from the house consumption. May stay empty.
            pick: true
            suggest:
            - wallbox
            - charger
            - laad
            - ev
            - charge
            pick_hint: Pick the charging power of your EV charger.
          - type: section
            name: Check
          - entity: sensor.batterijplan_huisverbruik
            name: House consumption now
            info: Grid power + solar power + battery power − charger. Should roughly match what your house really uses, and is never negative.
  - type: grid
    cards:
    - type: custom:batterijplan-status
  - type: grid
    column_span: 2
    cards:
    - type: custom:batterijplan-plan
      title: Plan today and tomorrow
      icon: batterijplan:kalender-klok
  - type: grid
    column_span: 3
    cards:
    - type: custom:batterijplan-grafiek
      title: Price and battery
      icon: batterijplan:euro-klok
      datumkiezer: true
      height: 240
      vergelijk: true
