# Batterijplan v1.0.0-dev1 — dashboard (Nederlands)
# Plakken in: Instellingen → Dashboards → (jouw dashboard) → ✏️ → ⋮ → Raw-configuratie-editor
# Nodig: de kaarten (www/batterijplan/batterijplan-cards.js) als dashboard-bron, zie docs/01-installatie.
title: Batterijplan
views:
- title: Batterijplan
  path: batterijplan
  icon: mdi:battery-clock
  type: sections
  max_columns: 3
  header:
    layout: responsive
    badges_position: bottom
    badges_wrap: wrap
    card:
      type: markdown
      text_only: true
      content: <img src="/local/batterijplan/logo.webp?v=1" height="88" alt="HBC-Batterijplan">
  badges:
  - type: entity
    entity: sensor.batterijplan_meerwaarde
    name: Bespaard totaal
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:cash-plus
    color: green
  - type: entity
    entity: sensor.batterijplan_meerwaarde_periode
    name: Deze energieperiode
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:calendar-check
    color: teal
  - type: entity
    entity: sensor.batterijplan_voorspelling
    name: Trefzekerheid
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:crystal-ball
    color: '#cfcfcf'
    visibility:
    - condition: state
      entity: sensor.batterijplan_voorspelling_kleur
      state: grijs1
  - type: entity
    entity: sensor.batterijplan_voorspelling
    name: Trefzekerheid
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:crystal-ball
    color: '#9e9e9e'
    visibility:
    - condition: state
      entity: sensor.batterijplan_voorspelling_kleur
      state: grijs2
  - type: entity
    entity: sensor.batterijplan_voorspelling
    name: Trefzekerheid
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:crystal-ball
    color: '#616161'
    visibility:
    - condition: state
      entity: sensor.batterijplan_voorspelling_kleur
      state: grijs3
  - type: entity
    entity: sensor.batterijplan_voorspelling
    name: Trefzekerheid
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:crystal-ball
    color: '#c5e1a5'
    visibility:
    - condition: state
      entity: sensor.batterijplan_voorspelling_kleur
      state: groen1
  - type: entity
    entity: sensor.batterijplan_voorspelling
    name: Trefzekerheid
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:crystal-ball
    color: '#9ccc65'
    visibility:
    - condition: state
      entity: sensor.batterijplan_voorspelling_kleur
      state: groen2
  - type: entity
    entity: sensor.batterijplan_voorspelling
    name: Trefzekerheid
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:crystal-ball
    color: '#66bb6a'
    visibility:
    - condition: state
      entity: sensor.batterijplan_voorspelling_kleur
      state: groen3
