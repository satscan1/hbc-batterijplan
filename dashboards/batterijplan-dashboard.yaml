# Batterijplan — dashboard (Home Assistant 'sections'-weergave)
# Installeren: Instellingen > Dashboards > Dashboard toevoegen > Nieuw dashboard,
# open het, ⋮ > Bewerken > ⋮ > Raw-configuratie-editor, en plak dit bestand.
title: Batterijplan
views:
- title: Batterijplan
  path: batterijplan
  icon: mdi:battery-clock
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: sensor.batterijplan_meerwaarde
    name: Bespaard totaal
    show_name: true
    show_state: true
    show_icon: true
