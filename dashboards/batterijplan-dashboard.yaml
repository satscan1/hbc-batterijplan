# Batterijplan v1.0.0-rc1 — dashboard (Nederlands)
# Plakken in: Instellingen → Dashboards → (jouw dashboard) → bewerken (potlood) → ⋮ → Raw-configuratie-editor
# Nodig: de kaarten (www/batterijplan/batterijplan-cards.js) als dashboard-bron, zie docs/01-installation.nl.md.
title: Batterijplan
views:
- title: Batterijplan
  path: batterijplan
  icon: mdi:battery-clock
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:batterijplan-knoppen
      live: input_boolean.batterijplan_live
      knoppen:
      - naam: Opbrengst
        kaarten:
        - type: custom:batterijplan-opbrengst
          title: Wat levert het op
          icon: batterijplan:euro
      - naam: Advies HBC
        melding: advies
        kaarten:
        - type: custom:batterijplan-advies
          title: Advies voor HBC
          icon: batterijplan:schuifregelaars
      - naam: Instellingen
        melding: instellingen
        kaarten:
        - type: custom:batterijplan-velden
          title: Instellingen
          icon: batterijplan:schuifregelaars
          info: |-
            Hier stel je Batterijplan in op jouw batterijen en je energiecontract.

            **Basis** vul je één keer in. **Expert** hoef je meestal niet aan te passen.

            Ontbreekt er iets essentieels, dan krijgt het knopje Instellingen een oranje stip.

            Maak na het invullen een **back-up**. Die blijft bewaard bij een herstart en bij een nieuwe versie.
          tabs:
          - naam: Basis
            sub: Instellen en vergeten
            rows:
            - entity: input_number.batterijplan_capaciteit
              name: Bruikbare capaciteit batterijen
              info: |-
                Wat je batterijen samen écht kunnen leveren, boven de ondergrens die in HBC staat.

                Voorbeeld: 2 batterijen van 5,12 kWh met 12 % ondergrens ≈ 9,0 kWh.

                Zolang dit niet is ingevuld, doet het plan niets.
            - entity: input_select.batterijplan_hbc_prijzen
              name: Prijzen van HBC
              info: |-
                Staan de prijzen in HBC als kale beursprijs (zonder belasting en opslag), kies **kaal**.

                Geeft HBC all-in prijzen (met energiebelasting, opslag en btw), kies **all-in**. Dan telt Batterijplan zelf niets meer op en is Energiebelasting + inkoop niet nodig.
            - entity: input_datetime.batterijplan_contract_start
              name: Ingangsdatum energiecontract
              info: |-
                De dag waarop je contractjaar begint. Het jaartal maakt niet uit.

                De opbrengst "deze energieperiode" telt vanaf deze datum en begint elk contractjaar opnieuw.
            - type: section
              name: Back-up
            - type: buttons
              buttons:
              - name: Back-up maken
                entity: input_button.batterijplan_backup
              - name: Back-up terugzetten
                entity: input_button.batterijplan_terugzetten
                confirm: true
              - name: Standaardwaarden
                entity: input_button.batterijplan_standaard
                confirm: true
              name: Instellingen bewaren
              info: |-
                **Back-up maken** bewaart al deze instellingen, ook de sensoren.

                **Back-up terugzetten** zet alles terug uit de laatste back-up, bijvoorbeeld na een herinstallatie of een vergissing.

                **Standaardwaarden** zet de veiligheidsmarge en het rendement terug op 0,3 kWh en 75 %. Er wordt eerst een back-up gemaakt, dus je kunt dit ongedaan maken.

                Bij terugzetten en standaardwaarden vraagt de knop eerst: Zeker?
            - type: backup
          - naam: Expert
            sub: Alleen aanpassen als je weet waarom
            rows:
            - entity: input_number.batterijplan_marge
              name: Veiligheidsmarge
              info: |-
                Lading die het plan nooit inrekent, zodat het niet te krap plant.

                0,3 kWh is een goed begin. Raakt de batterij vaak te vroeg leeg, verhoog dan de marge.
            - entity: input_number.batterijplan_rendement
              name: Rendement laden + ontladen
              info: |-
                Hoeveel procent van de geladen stroom er weer uitkomt.

                Weet je het niet? Begin met 75 %.
            - entity: input_number.batterijplan_opslag
              name: Energiebelasting + inkoop (excl. btw)
              kind: stepper
              step: 0.001
              info: |-
                Wat je per kWh bóvenop de kale beursprijs betaalt, zonder btw: de energiebelasting (2026: € 0,09161) plus de inkoopvergoeding van je leverancier (staat op je contract).

                Voorbeeld: 0,09161 + 0,0165 = 0,1081.

                Tik op het getal om het precies te typen. Bij Prijzen van HBC = all-in is dit niet nodig.
      - naam: Sensoren
        melding: sensoren
        kaarten:
        - type: custom:batterijplan-velden
          title: Sensoren
          icon: batterijplan:thuisbatterij
          info: |-
            Tik op een veld: je krijgt een lijst met de vermogenssensoren uit jouw Home Assistant, de meest waarschijnlijke bovenaan, met rechts wat ze nu melden. Tik op de juiste. Typen filtert de lijst; je mag de naam ook helemaal zelf typen.

            Het gaat steeds om het vermogen van **dit moment in watt (W)**, geen dagtotaal in kWh.

            Onder elke gekozen naam zie je wat die sensor nu meldt.

            **Huisverbruik nu** moet ongeveer kloppen met wat je huis echt gebruikt.
          rows:
          - entity: input_text.batterijplan_sensor_net
            name: Netvermogen (W)
            info: Afname van het net is +, teruglevering is −.
            pick: true
            suggest:
            - p1
            - grid
            - net
            - meter
            - dsmr
            - consumption
            - afname
            pick_hint: Afname is +, teruglevering is −. Kies de sensor die nu het netvermogen van je hele huis meldt.
          - entity: input_text.batterijplan_sensor_zon
            name: Zonnevermogen nu (W)
            info: |-
              Wat al je zonnepanelen samen nu opwekken.

              Meerdere omvormers? Maak een helper Combineer de status van meerdere sensoren, met type Som.
            pick: true
            suggest:
            - pv
            - solar
            - zon
            - inverter
            - omvormer
            - opbrengst
            - production
            pick_hint: Kies de sensor met wat al je zonnepanelen samen nu opwekken.
          - entity: input_text.batterijplan_sensor_batterij
            name: Batterijvermogen (W)
            info: |-
              Totaal van al je batterijen, ontladen is +.

              Bij HBC meestal sensor.house_total_battery_power.
            pick: true
            suggest:
            - house_total_battery
            - battery
            - batterij
            - accu
            - marstek
            pick_hint: 'Kies het totaal van al je batterijen (ontladen is +). Bij HBC meestal: house total battery power.'
          - entity: input_text.batterijplan_sensor_ev
            name: Laadpaal (W, optioneel)
            info: Laadvermogen van je auto-lader. Wordt van het huisverbruik afgetrokken. Mag leeg blijven.
            pick: true
            suggest:
            - wallbox
            - charger
            - laad
            - ev
            - charge
            pick_hint: Kies het laadvermogen van je auto-lader.
          - type: section
            name: Controle
          - entity: sensor.batterijplan_huisverbruik
            name: Huisverbruik nu
            info: Netvermogen + zonnevermogen + batterijvermogen − laadpaal. Moet ongeveer kloppen met wat je huis echt gebruikt, en is nooit negatief.
  - type: grid
    cards:
    - type: custom:batterijplan-status
  - type: grid
    column_span: 2
    cards:
    - type: custom:batterijplan-plan
      title: Plan vandaag en morgen
      icon: batterijplan:kalender-klok
  - type: grid
    column_span: 3
    cards:
    - type: custom:batterijplan-grafiek
      title: Prijs en batterij
      icon: batterijplan:euro-klok
      datumkiezer: true
      height: 240
      vergelijk: true
